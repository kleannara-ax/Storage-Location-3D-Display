server:
  port: 8080

spring:
  application:
    name: Storage-Location-3D-Display

  # ============================================================
  # H2 In-Memory DB (replaces MariaDB for local testing)
  # ============================================================
  datasource:
    url: jdbc:h2:mem:storage_3d_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: H2-Default-Pool
      maximum-pool-size: 10
      minimum-idle: 5

    # ==========================================================
    # Secondary DataSource (H2 replaces OracleDB for local testing)
    # ==========================================================
    inventory:
      url: jdbc:h2:mem:inventory_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.company: DEBUG
    org.hibernate.SQL: DEBUG

# ============================================================
# Inventory module H2 dialect override
# ============================================================
inventory:
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      ddl-auto: update
