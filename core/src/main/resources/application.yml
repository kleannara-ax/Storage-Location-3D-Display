server:
  port: 8080

spring:
  application:
    name: Storage-Location-3D-Display

  # ============================================================
  # Default DataSource (MariaDB) - core, module-user
  # ============================================================
  datasource:
    url: jdbc:mariadb://localhost:3306/storage_3d_db?useUnicode=true&characterEncoding=utf8
    username: root
    password: root1234
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: MariaDB-Pool
      maximum-pool-size: 10
      minimum-idle: 5
    # ==========================================================
    # Secondary DataSource (OracleDB) - module-inventory
    # Consumed by InventoryDataSourceConfig
    # @ConfigurationProperties(prefix = "spring.datasource.inventory")
    # ==========================================================
    inventory:
      url: jdbc:oracle:thin:@localhost:1521:ORCL
      username: inventory_user
      password: inventory1234
      driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.company: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
